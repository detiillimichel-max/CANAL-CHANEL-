name: deploy-pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "catalogos/catalogo-br.json"
      - "catalogos/catalogo-pt.json"
      - "catalogos/catalogo-us.json"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar somente os arquivos públicos da PWA
        run: |
          set -euo pipefail
          test -s app/index.html
          test -s app/manifest.json
          test -s app/sw.js
          test -s app/style.css
          test -s app/app.js
          mkdir -p site/catalogos
          cp -R app/. site/
          cp catalogos/catalogo-br.json site/catalogos/
          cp catalogos/catalogo-pt.json site/catalogos/
          cp catalogos/catalogo-us.json site/catalogos/
          touch site/.nojekyll
          python - <<'PY'
          import json
          from pathlib import Path
          for code in ("br", "pt", "us"):
              path = Path("site/catalogos") / f"catalogo-{code}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(data.get("channels"), list), f"Catálogo inválido: {path}"
              print(f"{path}: {len(data['channels'])} canais")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato da PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4