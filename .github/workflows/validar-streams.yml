name: validar-streams

on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * 0"
  workflow_run:
    workflows:
      - catalogo-global
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: catalogos-maintenance-master
  cancel-in-progress: false

jobs:
  validar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar sintaxe
        run: python -m py_compile scripts/validar_streams.py

      - name: Validar endpoints públicos
        run: python scripts/validar_streams.py

      - name: Conferir JSONs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for code in ("br", "pt", "us"):
              path = Path("catalogos") / f"catalogo-{code}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              summary = data["summary"].get("validation", {})
              print(f"{path}: {sum(summary.values())} verificações")
              print(summary)
          PY

      - name: Salvar resultados no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogos/catalogo-br.json catalogos/catalogo-pt.json catalogos/catalogo-us.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos resultados."
            exit 0
          fi
          git commit -m "Atualizar validação dos streams"
          git push
